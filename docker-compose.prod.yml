version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sip_meetings
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:4.6.2-alpine
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49152-49252:49152-49252/udp"
    command: >
      -n
      --log-file=stdout
      --min-port=49152
      --max-port=49252
      --realm=localhost
      --user=turnuser:turnpassword
      --lt-cred-mech
      --fingerprint
      --no-tlsv1
      --no-tlsv1_1
    restart: unless-stopped

  freeswitch:
    image: drachtio/drachtio-freeswitch-mrf:latest
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5066:5066/tcp"
      - "7443:7443/tcp"
      - "8021:8021/tcp"
      - "8443:8443/tcp"
      - "16384-16484:16384-16484/udp"
    volumes:
      - ./infra/freeswitch/conf:/etc/freeswitch:ro
      - ./infra/certs:/etc/freeswitch/certs:ro
    environment:
      - FREESWITCH_DOMAIN=192.168.100.218
    healthcheck:
      test: ["CMD", "fs_cli", "-x", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - redis

  drachtio:
    image: drachtio/drachtio-server:latest
    ports:
      - "9022:9022/tcp"
      - "5062:5062/udp"
      - "5062:5062/tcp"
    command: drachtio --contact "sip:*:5062;transport=udp,tcp" --loglevel info
    restart: unless-stopped
    depends_on:
      - freeswitch

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sip_meetings
      REDIS_URL: redis://redis:6379
      ENABLE_SIP: "true"
      DRACHTIO_HOST: drachtio
      DRACHTIO_PORT: 9022
      DRACHTIO_SECRET: cymru
      FREESWITCH_HOST: freeswitch
      FREESWITCH_ESL_PORT: 8021
      FREESWITCH_ESL_PASSWORD: ClueCon
      SIP_DOMAIN: 192.168.100.218
      WSS_URL: wss://192.168.100.218/ws
      STUN_URL: stun:stun.l.google.com:19302
      TURN_URL: turn:localhost:3478
      TURN_USERNAME: turnuser
      TURN_PASSWORD: turnpassword
      TOKEN_SECRET: your-secret-key-change-in-production
      TOKEN_TTL_SECONDS: 3600
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      coturn:
        condition: service_started
      drachtio:
        condition: service_started
      freeswitch:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl.crt:/etc/nginx/ssl/ssl.crt:ro
      - ./ssl.key:/etc/nginx/ssl/ssl.key:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
