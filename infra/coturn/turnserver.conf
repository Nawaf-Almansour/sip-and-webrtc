# TURN server configuration

# Listener IP address
listening-ip=0.0.0.0

# Listener port for STUN/TURN
listening-port=3478

# TLS listening port
tls-listening-port=5349

# Relay ports range
min-port=49152
max-port=49252

# Realm
realm=localhost

# Server name
server-name=sip-turn

# Credentials
user=turnuser:turnpassword

# Fingerprint
fingerprint

# Long-term credential mechanism
lt-cred-mech

# Logging
log-file=/var/log/turnserver.log
verbose

# No CLI
no-cli

# Disable TLS for development (enable in production)
# cert=/etc/coturn/certs/turn.crt
# pkey=/etc/coturn/certs/turn.key

# Allow loopback peers (for development)
allow-loopback-peers

# No multicast peers
no-multicast-peers
