version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sip-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sip_meetings
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sip-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: sip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sip-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FreeSWITCH Media Server
  freeswitch:
    image: drachtio/drachtio-freeswitch-mrf:latest
    container_name: sip-freeswitch
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5061:5061/tcp"
      - "8021:8021/tcp"
      - "8443:8443/tcp"
      - "16384-16484:16384-16484/udp"
    volumes:
      - ./infra/freeswitch/conf:/etc/freeswitch:ro
      - ./infra/certs:/etc/freeswitch/certs:ro
    environment:
      - FREESWITCH_DOMAIN=localhost
    networks:
      - sip-network
    healthcheck:
      test: ["CMD", "fs_cli", "-x", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # TURN/STUN Server
  coturn:
    image: coturn/coturn:4.6.2-alpine
    container_name: sip-coturn
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49152-49252:49152-49252/udp"
    volumes:
      - ./infra/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./infra/certs:/etc/coturn/certs:ro
    command: -c /etc/coturn/turnserver.conf
    networks:
      - sip-network
    healthcheck:
      test: ["CMD", "turnutils_stunclient", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sip-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/sip_meetings?schema=public
      - REDIS_URL=redis://redis:6379
      - FREESWITCH_HOST=freeswitch
      - FREESWITCH_ESL_PORT=8021
      - FREESWITCH_ESL_PASSWORD=ClueCon
      - SIP_DOMAIN=localhost
      - WSS_URL=wss://freeswitch:8443
      - TURN_URL=turn:coturn:3478
      - TURN_USERNAME=turnuser
      - TURN_PASSWORD=turnpassword
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      freeswitch:
        condition: service_healthy
    networks:
      - sip-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Frontend Web App
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: sip-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sip-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  sip-network:
    driver: bridge
